name: iOS Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy_ios:
    name: Build & Deploy iOS
    if: contains(github.event.head_commit.message, '[deploy_test]') || contains(github.event.head_commit.message, '[deploy_prod]')
    runs-on: macos-26
    defaults:
      run:
        working-directory: flutter
    steps:
      # --- common: checkout ---
      - name: Checkout code from ref
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}
      # --- common: env file ---
      - name: Create env file
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod
          echo "COMMIT_TIMESTAMP=$(git log -1 --format=%ct)" >> .env.prod
      # --- common: flutter setup ---
      - name: Run Flutter tasks
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'

      # --- ios-specific ---
      - name: Decode App Store Connect API key
        run: echo "$ASC_API_KEY" | base64 -d > ios/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: 'flutter/ios'
      - name: Install certificates via Fastlane Match
        uses: maierj/fastlane-action@v3.0.0
        with:
          lane: 'install_certificates'
          subdirectory: 'flutter/ios'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_AUTH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build ipa --release --export-options-plist ios/export.plist --dart-define-from-file=.env.prod
      - name: Upload to TestFlight
        if: contains(github.event.head_commit.message, '[deploy_test]')
        uses: maierj/fastlane-action@v3.0.0
        with:
          lane: 'closed_beta'
          subdirectory: 'flutter/ios'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_AUTH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      # --- prod: upload directly to App Store and submit for review ---
      - name: Release to App Store
        if: contains(github.event.head_commit.message, '[deploy_prod]')
        uses: maierj/fastlane-action@v3.1.0
        with:
          lane: 'release'
          subdirectory: 'flutter/ios'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
