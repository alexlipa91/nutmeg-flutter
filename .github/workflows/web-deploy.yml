name: Web Build and Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'flutter/**'

jobs:
  deploy_web:
    name: Deploy Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      # --- common: checkout ---
      - name: Checkout code from ref
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}
      # --- common: env file ---
      - name: Create env file
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod
          echo "COMMIT_TIMESTAMP=$(git log -1 --format=%cd --date=format:'%Y%m%d-%H%M')" >> .env.prod
      # --- common: flutter setup ---
      - name: Run Flutter tasks
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"

      # --- web-specific ---
      - run: ./scripts/build_web_app.sh
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_NUTMEG_9099C }}"
          PROJECT_PATH: flutter
