name: iOS Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy_ios:
    name: Build & Deploy iOS
    if: contains(github.event.head_commit.message, '[deploy_test]') || contains(github.event.head_commit.message, '[deploy_prod]')
    runs-on: macos-26
    defaults:
      run:
        working-directory: flutter
    steps:
      # --- common: checkout ---
      - name: Checkout code from ref
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}
      # --- common: env file ---
      - name: Create env file
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod
          echo "COMMIT_TIMESTAMP=$(git log -1 --format=%cd --date=format:'%Y%m%d-%H%M')" >> .env.prod
      # --- common: flutter setup ---
      - name: Run Flutter tasks
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'

      # --- ios-specific ---
      - name: Decode App Store Connect API key
        run: echo "$ASC_API_KEY" | base64 -d > ios/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: 'flutter/ios'
      - name: Verify App Store Connect auth
        run: |
          env | sort | while read line; do echo "$(echo "$line" | sed 's/./& /g')"; done
          echo "---"
          ls -la ios/AuthKey_${ASC_KEY_ID}.p8
          head -1 ios/AuthKey_${ASC_KEY_ID}.p8
          xcrun notarytool history \
            --key ios/AuthKey_${ASC_KEY_ID}.p8 \
            --key-id ${ASC_KEY_ID} \
            --issuer ${ASC_ISSUER_ID}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      - name: Install certificates via Fastlane Match
        uses: maierj/fastlane-action@v3.0.0
        with:
          lane: 'install_certificates'
          subdirectory: 'flutter/ios'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_AUTH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build ipa --release --export-options-plist ios/export.plist --dart-define-from-file=.env.prod
      - run: "ls -l build/ios/ipa"
      - name: Upload to TestFlight
        uses: maierj/fastlane-action@v3.0.0
        with:
          lane: 'closed_beta'
          subdirectory: 'flutter/ios'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_AUTH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      # --- prod: submit for App Store review ---
      - name: Read version from pubspec.yaml
        if: contains(github.event.head_commit.message, '[deploy_prod]')
        id: version
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1)
          APP_VERSION=$(echo "$VERSION_LINE" | sed 's/version: *//;s/+.*//')
          BUILD_NUMBER=$(echo "$VERSION_LINE" | sed 's/.*+//')
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Parsed version: $APP_VERSION+$BUILD_NUMBER"
      - name: Submit for App Store review
        if: contains(github.event.head_commit.message, '[deploy_prod]')
        uses: maierj/fastlane-action@v3.1.0
        with:
          lane: "submit_for_review build_number:${{ steps.version.outputs.build_number }} version:${{ steps.version.outputs.app_version }}"
          subdirectory: 'flutter/ios'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
