name: Appstore Deployment

on:
  push:
    tags:
      - v*
    branches:
      - master

jobs:
  deploy_ios:
    name: Deploy build to TestFlight
    runs-on: macOS-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout code from ref
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}
      - name: Decode App Store Connect API key
        run: echo "$ASC_API_KEY" | base64 -d > ios/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: 'flutter/ios'
      - name: Install certificates via Fastlane Match
        uses: maierj/fastlane-action@v3.0.0
        with:
          lane: 'install_certificates'
          subdirectory: 'flutter/ios'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_AUTH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
      - name: Create env file
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod
      - name: Run Flutter tasks
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build ipa --release -t lib/screens/Launch.dart --export-options-plist ios/export.plist --dart-define-from-file=.env.prod
      - run: "ls -l build/ios/ipa"
      - name: Upload to TestFlight
        uses: maierj/fastlane-action@v3.0.0
        with:
          lane: 'closed_beta'
          subdirectory: 'flutter/ios'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_AUTH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
