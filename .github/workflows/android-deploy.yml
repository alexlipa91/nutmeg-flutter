name: Playstore Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy_android:
    name: Deploy build to Playstore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from ref
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}

      - run: echo $NUTMEG_DEPLOY_KEY  | base64 -d > android/nutmeg-deploy-key.json
        env:
          NUTMEG_DEPLOY_KEY: ${{ secrets.NUTMEG_DEPLOY_KEY }}

      - run: echo $ANDROID_JSON | base64 -d > android/nutmeg-9099c-sa-credentials.json
        env:
          ANDROID_JSON: ${{ secrets.ANDROID_JSON }}

      - name: Create key.properties
        run: |
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties

      - name: Create env file
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod

      - name: Build appbundle
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2" # keep in sync with .fvm/fvm_config.json
      - run: ./scripts/build_android_app.sh

      - name: Deploy to Playstore production
        uses: maierj/fastlane-action@v1.4.0
        with:
          lane: playstoreProduction
          subdirectory: android